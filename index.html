  <!-- 카카오 SDK (공유 + 지도 공통 키) -->
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>

  <!-- 카카오 지도 API 동적 로드 -->
  <script>
    function loadKakaoMap(appKey) {
      if (!appKey || appKey === 'YOUR_KAKAO_JAVASCRIPT_KEY') {
        const el = document.getElementById('kakao-map');
        if (el) {
          el.style.cssText = 'display:flex;align-items:center;justify-content:center;background:#D0E6FA;';
          el.innerHTML = '<p style="font-size:12px;color:#4A6080;text-align:center">지도를 표시하려면<br>config.js의 kakaoMap.appKey를 입력해주세요</p>';
        }
        return;
      }
      const script = document.createElement('script');
      script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${appKey}&libraries=services&autoload=false`;
      script.onload = () => kakao.maps.load(initKakaoMap);
      document.head.appendChild(script);
    }

    function initKakaoMap() {
      const C = WEDDING_CONFIG;
      const container = document.getElementById('kakao-map');
      if (!container) return;

      const defaultPos = new kakao.maps.LatLng(C.venue.lat, C.venue.lng);
      const map = new kakao.maps.Map(container, {
        center: defaultPos,
        level: C.kakaoMap.level || 3,
      });

      // 주소로 정확한 좌표 조회 후 마커 + 인포윈도우 표시
      const geocoder = new kakao.maps.services.Geocoder();
      geocoder.addressSearch(C.venue.address, (result, status) => {
        const pos = (status === kakao.maps.services.Status.OK)
          ? new kakao.maps.LatLng(result[0].y, result[0].x)
          : defaultPos;

        map.setCenter(pos);

        const marker = new kakao.maps.Marker({ position: pos });
        marker.setMap(map);

        new kakao.maps.CustomOverlay({
          position: pos,
          content: `<div style="background:#fff;border:2px solid #3D84D6;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;color:#0D2B6B;white-space:nowrap;box-shadow:0 2px 8px rgba(61,132,214,0.2);margin-bottom:8px">${C.venue.name}<div style="font-size:10px;font-weight:400;color:#4A6080;margin-top:2px">${C.venue.hall}</div></div>`,
          yAnchor: 1.5,
        }).setMap(map);
      });
    }
  </script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    window._firebaseModules = { initializeApp, getDatabase, ref, push, onValue, query, orderByChild, limitToLast };
  </script>

  <style>
    /* ── 디자인 토큰 ── */
    :root {
      --sky-start:   #B8D9F8;
      --sky-end:     #E8F4FD;
      --accent:      #3D84D6;
      --accent-soft: #EAF3FC;
      --navy:        #0D2B6B;
      --label:       #4A6080;

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(180deg, var(--sky-start) 0%, var(--sky-end) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;

    .page-wrap {

      padding: 0 0 40px;

    /* 섹션 라벨 */

      font-family: 'Montserrat', sans-serif;
      font-size: 9px;

      padding: 32px 0 4px;
      text-transform: uppercase;

    .section-sublabel {

      font-size: 13px;

      text-align: center;
      padding: 0 0 16px;
    }

    /* 공통 카드 */
    .card {
      background: var(--white);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      margin: 0 20px;
      overflow: hidden;
    }

    /* 토스트 */

      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--navy);
      color: #fff;
      font-size: 13px;
      padding: 12px 24px;
      border-radius: 999px;
      white-space: nowrap;
      z-index: 9999;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 페이드인 애니메이션 */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

       S1 · 인트로
    ══════════════════════════════════════ */

      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }
    #intro-overlay.hidden {

      pointer-events: none;
    }
    #intro-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #skip-btn {
      position: fixed;
      top: 52px;
      right: 20px;
      z-index: 1001;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 7px 16px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      cursor: pointer;
      letter-spacing: 1px;

      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--accent);
      z-index: 1001;

      font-weight: 700;

      align-items: center;

      padding: 14px;

      position: fixed;

      background: rgba(13,43,107,0.92);
      z-index: 500;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    #gallery-modal.active { display: flex; }
    .modal-img-wrap {
      position: relative;
      width: calc(100% - 64px);
      max-width: 380px;

    #modal-img {
      width: 100%;
      border-radius: 16px;
      display: block;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .modal-close {
      position: absolute;
      top: -16px; right: -16px;
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;

      border: 1px solid rgba(255,255,255,0.2);

      top: 50%;
      transform: translateY(-50%);

      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .modal-nav.prev { left: -52px; }
    .modal-nav.next { right: -52px; }
    .modal-counter {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      margin-top: 20px;
    }
    .modal-dots {

      gap: 6px;

      border-radius: 3px;

    .venue-name {

      display: grid;

      border-radius: 14px;

      color: var(--accent);

    ══════════════════════════════════════ */

       S7 · 방명록
    ══════════════════════════════════════ */
    .guestbook-wrap { margin: 0 20px; }
    .guestbook-form {
      background: var(--white);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 24px 20px;
      margin-bottom: 12px;
    }
    .gb-input {
      width: 100%;
      background: var(--accent-soft);
      border: 1px solid #C5D8EC;
      border-radius: 12px;
      padding: 12px 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      color: var(--navy);
      outline: none;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }
    .gb-input:focus { border-color: var(--accent); }
    .gb-input::placeholder { color: #A8BDD4; }
    textarea.gb-input { resize: none; height: 80px; }
    .gb-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #2E6DB4, #3D84D6);
      border: none;
      border-radius: 999px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .gb-submit:active { opacity: 0.8; }
    .gb-item {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(61,132,214,0.07);
      padding: 16px 18px;
      margin-bottom: 8px;
      border-left: 3px solid var(--accent);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.4s forwards;
    }
    @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
    .gb-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .gb-name { font-size: 13px; font-weight: 700; color: var(--accent); }
    .gb-time {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      color: var(--label);
    }
    .gb-msg { font-size: 13px; color: var(--navy); line-height: 1.6; }

    /* ══════════════════════════════════════
       S8 · 이벤트 안내
    ══════════════════════════════════════ */
    .event-card {
      background: var(--white);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      margin: 0 20px 12px;
      padding: 28px 24px;
      position: relative;
      overflow: hidden;
    }
    .event-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), #7EC8F0);
    }
    .event-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 12px;
    }
    .event-body {
      font-size: 13px;
      color: var(--label);
      line-height: 1.9;
    }

    /* ══════════════════════════════════════
       S9 · 공유 + 푸터
    ══════════════════════════════════════ */
    .share-wrap { margin: 0 20px; }
    .og-preview {
      background: var(--white);
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      display: flex;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .og-thumb {
      width: 80px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #B8D9F8, #7EC8F0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .og-info { padding: 14px; flex: 1; }
    .og-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 4px;
      line-height: 1.5;
    }
    .og-desc { font-size: 11px; color: var(--label); line-height: 1.6; }

    .kakao-btn {
      width: 100%;
      padding: 15px;
      background: #FEE500;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      color: #3A1D00;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(254,229,0,0.35);
      transition: opacity 0.2s;
    }
    .kakao-btn:active { opacity: 0.85; }

    .footer {
      text-align: center;
      padding: 48px 20px 60px;
    }
    .footer-divider {
      width: 60px;
      height: 1px;
      background: #C5D8EC;
      margin: 0 auto 24px;
    }
    .footer-names {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 8px;
    }
    .footer-date {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      color: var(--label);
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .footer-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      color: #A8BDD4;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<!-- S1 · 인트로 오버레이 -->
<div id="intro-overlay">
  <video id="intro-video" autoplay muted playsinline loop></video>
  <div class="intro-progress" id="intro-progress"></div>
</div>
<button id="skip-btn">SKIP ▶</button>

<!-- 본문 -->
<div class="page-wrap">

  <!-- S2 · 보딩패스 -->
  <section id="s2">
    <p class="bp-page-title">Boarding Pass</p>
    <div class="bp-card fade-in">
      <p class="bp-flight-label">WEDDING FLIGHT</p>

      <!-- 공항코드 + 이름 + 부모님 -->
      <div class="bp-route">
        <div>
          <div class="bp-code" id="bp-groom-code"></div>
          <div class="bp-code-name" id="bp-groom-name"></div>

        </div>
        <div class="bp-plane-arrow">
          <div class="bp-plane-icon">✈</div>
        </div>
        <div style="text-align:right">
          <div class="bp-code" id="bp-bride-code"></div>
          <div class="bp-code-name" id="bp-bride-name"></div>

        </div>
      </div>

      <hr class="bp-divider" />

      <!-- Date / Time / Venue -->
      <div class="bp-info-grid bp-info-col-3" style="margin-bottom:14px">
        <div class="bp-info-item">
          <div class="bp-info-label">Date</div>
          <div class="bp-info-value" id="bp-date"></div>
        </div>
        <div class="bp-info-item">
          <div class="bp-info-label">Time</div>
          <div class="bp-info-value" id="bp-time"></div>
        </div>
        <div class="bp-info-item">
          <div class="bp-info-label">Venue</div>
          <div class="bp-info-value ko" id="bp-venue"></div>
        </div>
      </div>

      <hr class="bp-divider" />

      <!-- Class / Terminal / Seat -->
      <div class="bp-info-grid bp-info-col-3" style="margin-bottom:14px">
        <div class="bp-info-item">
          <div class="bp-info-label">Class</div>
          <div class="bp-info-value" id="bp-class"></div>
        </div>
        <div class="bp-info-item">
          <div class="bp-info-label">Terminal</div>
          <div class="bp-info-value" id="bp-terminal"></div>
        </div>
        <div class="bp-info-item">
          <div class="bp-info-label">Seat</div>
          <div class="bp-info-value" id="bp-seat"></div>
        </div>
      </div>

      <hr class="bp-divider" />

      <!-- Captain / ETKT -->
      <div class="bp-info-grid">
        <div class="bp-info-item">
          <div class="bp-info-label">Captain</div>
          <div class="bp-info-value ko" id="bp-captain"></div>
        </div>
        <div class="bp-info-item" style="text-align:right">

      <!-- 절취선 -->
      <div class="bp-perforation">

      </div>

      <!-- 커플 사진 -->
      <div class="bp-photo-wrap">
        <img id="bp-photo" src="assets/bp-couple.png" alt="커플 사진" loading="lazy" />
      </div>
    </div>
  </section>

  <!-- S3 · 초대 문구 -->
  <section id="s3">
    <p class="section-label" id="s3-label">Passenger Announcement</p>
    <div class="invite-card fade-in">
      <div class="invite-deco">
        <div class="invite-deco-line"></div>
        <span class="invite-deco-heart">♥</span>
        <div class="invite-deco-line right"></div>
      </div>
      <p class="invite-body" id="invite-body"></p>
      <div class="invite-sep"></div>
      <p class="invite-parents" id="invite-parents"></p>
      <div class="invite-date-box">
        <span class="invite-date-icon">📅</span>

          <div class="invite-date-main" id="invite-date-main"></div>

    <p class="section-label">Departure Details</p>
    <div class="venue-card fade-in">

        <div class="venue-hall" id="venue-hall"></div>
        <div class="venue-address" id="venue-address"></div>

      <div class="venue-map">
        <div id="kakao-map"></div>

    </div>
    <div class="transport-list" id="transport-list"></div>
    <div class="venue-btns">
      <a class="venue-btn kakao" id="kakao-map-btn" target="_blank" rel="noopener">카카오맵</a>
      <a class="venue-btn naver" id="naver-map-btn" target="_blank" rel="noopener">네이버지도</a>
    </div>
  </section>

  <!-- S6 · 계좌 안내 -->
  <section id="s6">
    <p class="section-label">Gift</p>
    <p class="section-sublabel">마음 전하기</p>
    <div id="account-list"></div>
  </section>

  <!-- S7 · 방명록 -->
  <section id="s7">

    <div class="guestbook-wrap">

<!-- 토스트 -->

<!-- 갤러리 모달 -->
<div id="gallery-modal">
  <div class="modal-img-wrap">
    <img id="modal-img" src="" alt="" />
    <button class="modal-close" onclick="closeModal()">✕</button>
    <button class="modal-nav prev" onclick="modalNav(-1)">‹</button>
    <button class="modal-nav next" onclick="modalNav(1)">›</button>
  </div>
  <div class="modal-counter" id="modal-counter"></div>
  <div class="modal-dots"    id="modal-dots"></div>
</div>

<script src="config.js"></script>
<script>
/* ════════════════════════════════════════
   초기화
════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  const C = WEDDING_CONFIG;

  /* ── S1 인트로 ── */
  const video    = document.getElementById('intro-video');
  const overlay  = document.getElementById('intro-overlay');
  const progress = document.getElementById('intro-progress');
  let progressInterval;

  function dismissIntro() {
    clearInterval(progressInterval);
    overlay.style.opacity = '0';
    overlay.style.pointerEvents = 'none';
    document.getElementById('skip-btn').style.display = 'none';
    setTimeout(() => {
      overlay.style.display = 'none';
      const s2 = document.getElementById('s2');
      if (s2) window.scrollTo({ top: s2.getBoundingClientRect().top + window.pageYOffset, behavior: 'smooth' });
    }, 500);
  }

  document.getElementById('skip-btn').addEventListener('click', dismissIntro);
  overlay.addEventListener('click', e => { if (e.target === overlay) dismissIntro(); });

  let elapsed = 0;
  const dur = C.intro.duration * 1000;
  progressInterval = setInterval(() => {
    elapsed += 100;
    progress.style.width = (elapsed / dur * 100) + '%';
    if (elapsed >= dur) dismissIntro();
  }, 100);

  if (C.intro.videoUrl) video.src = C.intro.videoUrl;

  /* ── S2 보딩패스 ── */
  document.getElementById('bp-groom-code').textContent    = C.groom.initial;
  document.getElementById('bp-groom-name').textContent    = C.groom.name;
  document.getElementById('bp-groom-parents').textContent = `${C.groom.fatherName}·${C.groom.motherName}의 아들`;
  document.getElementById('bp-bride-code').textContent    = C.bride.initial;
  document.getElementById('bp-bride-name').textContent    = C.bride.name;
  document.getElementById('bp-bride-parents').textContent = `${C.bride.fatherName}·${C.bride.motherName}의 딸`;
  document.getElementById('bp-date').textContent     = C.dateShort;
  document.getElementById('bp-time').textContent     = C.timeCode;
  document.getElementById('bp-venue').textContent    = C.venue.name;
  document.getElementById('bp-class').textContent    = C.boardingPass.class;
  document.getElementById('bp-terminal').textContent = C.boardingPass.terminal;
  document.getElementById('bp-seat').textContent     = C.boardingPass.seat;
  document.getElementById('bp-captain').textContent  = `${C.groom.name} · ${C.bride.name}`;
  document.getElementById('bp-etkt').textContent     = `WD${C.dateShort.replace(/\./g, '')}`;

  /* ── S3 초대 문구 ── */
  document.getElementById('s3-label').textContent    = C.invitationLabel || 'Passenger Announcement';
  document.getElementById('invite-body').textContent = C.invitation;
  document.getElementById('invite-parents').innerHTML =
    `${C.groom.fatherName}·${C.groom.motherName} 의 아들 &nbsp;<strong>${C.groom.name}</strong><br>` +
    `${C.bride.fatherName}·${C.bride.motherName} 의 딸 &nbsp;<strong>${C.bride.name}</strong>`;
  document.getElementById('invite-date-main').textContent = `${C.date}  ${C.time}`;
  document.getElementById('invite-date-sub').textContent  = C.venue.name;

  /* ── S4 갤러리 ── */
  const grid        = document.getElementById('gallery-grid');
  const viewAllBtn  = document.getElementById('gallery-viewall-btn');
  const initCount   = C.galleryInitialCount;

  C.gallery.forEach((img, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item' + (i >= initCount ? ' hidden' : '');
    item.innerHTML = `<img src="${img.src}" alt="${img.alt}" loading="lazy" />`;
    item.addEventListener('click', () => openModal(i));
    grid.appendChild(item);
  });

  viewAllBtn.addEventListener('click', () => {
    document.querySelectorAll('.gallery-item.hidden').forEach(el => el.classList.remove('hidden'));
    viewAllBtn.classList.add('expanded');
  });

  /* ── S5 위치 안내 ── */
  document.getElementById('venue-name').textContent    = `${C.venue.name} ${C.venue.hall}`;
  document.getElementById('venue-hall').textContent    = '';
  document.getElementById('venue-address').textContent = C.venue.address;
  document.getElementById('venue-tel').textContent     = C.venue.tel;
  document.getElementById('kakao-map-btn').href        = C.venue.kakaoMapLink;
  document.getElementById('naver-map-btn').href        = C.venue.naverMapLink;

  // 교통편 아코디언
  const tList = document.getElementById('transport-list');
  C.venue.transport.forEach(t => {
    const item = document.createElement('div');
    item.className = 'transport-item';
    item.innerHTML = `
      <div class="transport-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="transport-icon">${t.icon}</span>
        <span class="transport-title">${t.title}</span>
        <span class="transport-arrow">›</span>
      </div>
      <div class="transport-body">${t.body}</div>`;
    tList.appendChild(item);
  });

  /* ── S6 계좌 안내 ── */
  const accountList = document.getElementById('account-list');
  C.accounts.forEach(acc => {
    const card = document.createElement('div');
    card.className = 'account-card';
    card.style.background = acc.gradient || 'linear-gradient(135deg,#2E61C7,#3D84D6)';
    card.innerHTML = `
      <div class="account-side">${acc.side}</div>
      <div class="account-bank">${acc.bank}</div>
      <div class="account-number">${acc.number}</div>
      <div class="account-holder">예금주 &nbsp;${acc.holder}</div>
      <button class="account-copy-btn" onclick="copyAccount('${acc.number}')">복사</button>`;
    accountList.appendChild(card);
  });

  /* ── S7 방명록 ── */
  initFirebase();

  /* ── 스크롤 페이드인 observer 선언 (S8 이벤트 카드 등록 전에 미리 선언) ── */
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });

  /* ── S8 이벤트 ── */
  if (C.eventLabel)    document.getElementById('s8-label').textContent    = C.eventLabel;
  if (C.eventSublabel) document.getElementById('s8-sublabel').textContent = C.eventSublabel;

  const eventList  = document.getElementById('event-list');
  const eventsData = C.events || (C.event ? [C.event] : []);
  eventsData.forEach(ev => {
    const card = document.createElement('div');
    card.className = 'event-card fade-in';
    card.innerHTML = `
      <div class="event-title">${escapeHtml(ev.title)}</div>
      <div class="event-body">${escapeHtml(ev.content).replace(/\n/g, '<br>')}</div>`;
    eventList.appendChild(card);
  });

  /* ── S9 공유 ── */
  document.getElementById('og-title').textContent    = C.kakao.shareTitle;
  document.getElementById('og-desc').textContent     = C.kakao.shareDescription;
  document.getElementById('footer-names').textContent = `${C.groom.name}  ♥  ${C.bride.name}`;
  document.getElementById('footer-date').textContent  = C.dateCode;

  /* ── 카카오 SDK 초기화 (공유 + 지도 통합) ── */
  try {
    const mapKey = (C.kakaoMap && C.kakaoMap.appKey !== 'YOUR_KAKAO_JAVASCRIPT_KEY')
      ? C.kakaoMap.appKey : null;
    const shareKey = (C.kakao && C.kakao.appKey !== 'YOUR_KAKAO_JAVASCRIPT_KEY')
      ? C.kakao.appKey : null;
    const key = shareKey || mapKey;

    if (key && typeof Kakao !== 'undefined') {
      if (!Kakao.isInitialized()) Kakao.init(key);
    }
    loadKakaoMap(mapKey || shareKey);
  } catch(e) {
    console.warn('카카오 SDK 초기화 실패:', e);
  }

  /* ── 스크롤 페이드인 — 모든 렌더링 완료 후 일괄 등록 ── */
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
});

/* ════════════════════════════════════════
   갤러리 모달
════════════════════════════════════════ */
let currentModalIdx = 0;

function openModal(idx) {
  currentModalIdx = idx;
  renderModal();
  document.getElementById('gallery-modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('gallery-modal').classList.remove('active');
  document.body.style.overflow = '';
}

function modalNav(dir) {
  const total = WEDDING_CONFIG.gallery.length;
  currentModalIdx = (currentModalIdx + dir + total) % total;
  renderModal();
}

function renderModal() {
  const gallery = WEDDING_CONFIG.gallery;
  const total   = gallery.length;
  const img     = gallery[currentModalIdx];
  document.getElementById('modal-img').src        = img.src;
  document.getElementById('modal-img').alt        = img.alt;
  document.getElementById('modal-counter').textContent = `${currentModalIdx + 1} / ${total}`;

  const dotsEl  = document.getElementById('modal-dots');
  dotsEl.innerHTML = '';
  const range   = Math.min(5, total);
  let start     = Math.max(0, currentModalIdx - 2);
  let end       = Math.min(total, start + range);
  if (end - start < range) start = Math.max(0, end - range);
  for (let i = start; i < end; i++) {
    const d = document.createElement('div');
    d.className = 'modal-dot' + (i === currentModalIdx ? ' active' : '');
    dotsEl.appendChild(d);
  }
}

// 모달 배경 클릭 시 닫기
document.getElementById('gallery-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// 스와이프 제스처
let touchStartX = 0;
document.getElementById('gallery-modal').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });
document.getElementById('gallery-modal').addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) modalNav(diff > 0 ? 1 : -1);
});

/* ════════════════════════════════════════
   계좌 복사
════════════════════════════════════════ */
function copyAccount(number) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(number)
      .then(() => showToast('계좌번호가 복사되었습니다 ✓'))
      .catch(() => fallbackCopy(number));
  } else {
    fallbackCopy(number);
  }
}

function fallbackCopy(text) {
  const el = document.createElement('textarea');
  el.value = text;
  el.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(el);
  el.focus();
  el.select();
  try {
    document.execCommand('copy');
    showToast('계좌번호가 복사되었습니다 ✓');
  } catch (e) {
    showToast('번호를 직접 선택해 복사해주세요');
  }
  document.body.removeChild(el);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ════════════════════════════════════════
   방명록 (Firebase / localStorage 폴백)
════════════════════════════════════════ */
let db, dbRef;

function initFirebase() {
  const C = WEDDING_CONFIG;
  if (C.firebase.apiKey === 'YOUR_API_KEY') { loadLocalComments(); return; }
  const M = window._firebaseModules;
  if (!M) { setTimeout(initFirebase, 300); return; }
  const { initializeApp, getDatabase, ref, onValue, query, orderByChild, limitToLast } = M;
  const app = initializeApp(C.firebase);
  db    = getDatabase(app);
  dbRef = ref(db, 'comments');
  const q = query(dbRef, orderByChild('timestamp'), limitToLast(20));
  onValue(q, snapshot => {
    const comments = [];
    snapshot.forEach(child => comments.unshift({ id: child.key, ...child.val() }));
    renderComments(comments);
  });
}

async function submitGuestbook() {
  const nameEl = document.getElementById('gb-name');
  const msgEl  = document.getElementById('gb-msg');
  const name   = nameEl.value.trim();
  const msg    = msgEl.value.trim();
  if (!name || !msg) { showToast('이름과 메시지를 입력해주세요'); return; }

  const comment = { name, msg, timestamp: Date.now() };

  if (db && dbRef) {
    const { push } = window._firebaseModules;
    await push(dbRef, comment);
  } else {
    const saved = JSON.parse(localStorage.getItem('wedding_comments') || '[]');
    saved.unshift(comment);
    localStorage.setItem('wedding_comments', JSON.stringify(saved.slice(0, 20)));
    loadLocalComments();
  }

  nameEl.value = '';
  msgEl.value  = '';
  showToast('메시지가 등록되었습니다 ✓');
}

function loadLocalComments() {
  renderComments(JSON.parse(localStorage.getItem('wedding_comments') || '[]'));
}

function renderComments(comments) {
  const list = document.getElementById('gb-list');
  list.innerHTML = '';
  comments.forEach(c => {
    const item = document.createElement('div');
    item.className = 'gb-item';
    const timeStr = c.timestamp
      ? new Date(c.timestamp).toLocaleDateString('ko-KR', { month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' })
      : '';
    item.innerHTML = `
      <div class="gb-item-header">
        <span class="gb-name">${escapeHtml(c.name)}</span>
        <span class="gb-time">${timeStr}</span>
      </div>
      <div class="gb-msg">${escapeHtml(c.msg)}</div>`;
    list.appendChild(item);
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ════════════════════════════════════════
   카카오톡 공유
════════════════════════════════════════ */
function shareKakao() {
  const C = WEDDING_CONFIG;

  if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title:       C.kakao.shareTitle,
        description: C.kakao.shareDescription,
        imageUrl:    C.kakao.shareImageUrl,
        link: {
          mobileWebUrl: C.kakao.shareUrl,
          webUrl:       C.kakao.shareUrl,
        },
      },
      buttons: [{
        title: '청첩장 보기 ✈',
        link: {
          mobileWebUrl: C.kakao.shareUrl,
          webUrl:       C.kakao.shareUrl,
        },
      }],
    });
    return;
  }

  // 앱키 미설정 시 — 네이티브 공유 또는 URL 복사 폴백
  if (navigator.share) {
    navigator.share({
      title: C.kakao.shareTitle,
      text:  C.kakao.shareDescription,
      url:   C.kakao.shareUrl,
    }).catch(() => {});
  } else {
    fallbackCopy(C.kakao.shareUrl);
    showToast('링크가 복사되었습니다. 카카오톡에 붙여넣기 해주세요 ✓');
  }
}
